        <text x="124" y="364" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.12em">ALT</text>

        <text x="116" y="388" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.04em">[application user found for verified uid]</text>
        <line x1="796" y1="416" x2="484" y2="416" stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#login-arrow)"/>
        <rect x="596" y="396" width="88" height="12" rx="2" fill="#f5f5f5"/>
        <text x="640" y="405" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">C5 · USER</text>
        <line x1="476" y1="444" x2="164" y2="444" stroke="#eb6c36" stroke-width="1.4" marker-end="url(#login-arrow-accent)"/>
        <rect x="268" y="424" width="104" height="12" rx="2" fill="#f5f5f5"/>
        <text x="320" y="433" fill="#eb6c36" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">C6 · CONTINUE</text>

        <line x1="112" y1="468" x2="848" y2="468" stroke="#2d3142" stroke-opacity="0.20" stroke-width="1" stroke-dasharray="4,3"/>
        <text x="116" y="492" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.04em">[else · application user missing]</text>
        <line x1="796" y1="520" x2="484" y2="520" stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#login-arrow)"/>
        <rect x="592" y="500" width="96" height="12" rx="2" fill="#f5f5f5"/>
        <text x="640" y="509" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">C7 · RAISE 403</text>
        <line x1="476" y1="548" x2="164" y2="548" stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#login-arrow)"/>
        <rect x="268" y="528" width="104" height="12" rx="2" fill="#f5f5f5"/>
        <text x="320" y="537" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">C8 · HTTP 403</text>

        <rect x="60" y="56" width="200" height="64" rx="6" fill="#f5f5f5"/>
        <rect x="60" y="56" width="200" height="64" rx="6" fill="#4f5d75" fill-opacity="0.10" stroke="#7a8399" stroke-width="1"/>
        <rect x="68" y="64" width="32" height="12" rx="2" fill="none" stroke="#7a8399" stroke-opacity="0.40" stroke-width="0.8"/>
        <text x="84" y="73" fill="#7a8399" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">APP</text>
        <text x="160" y="88" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Mobile App</text>
        <text x="160" y="105" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">Firebase ID token</text>

        <rect x="380" y="56" width="200" height="64" rx="6" fill="#f5f5f5"/>
        <rect x="380" y="56" width="200" height="64" rx="6" fill="#eb6c36" fill-opacity="0.08" stroke="#eb6c36" stroke-width="1"/>
        <rect x="388" y="64" width="32" height="12" rx="2" fill="none" stroke="#eb6c36" stroke-opacity="0.50" stroke-width="0.8"/>
        <text x="404" y="73" fill="#eb6c36" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">API</text>
        <text x="480" y="88" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Backend API</text>
        <text x="480" y="105" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">current_user: CurrentUser</text>

        <rect x="700" y="56" width="200" height="64" rx="6" fill="#f5f5f5"/>
        <rect x="700" y="56" width="200" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <rect x="708" y="64" width="64" height="12" rx="2" fill="none" stroke="#2d3142" stroke-opacity="0.30" stroke-width="0.8"/>
        <text x="740" y="73" fill="#4f5d75" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">DEPENDENCY</text>
        <text x="800" y="88" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Current User Dependency</text>
        <text x="800" y="105" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">get_current_user(firebase_user, db)</text>

        <rect x="1020" y="56" width="200" height="64" rx="6" fill="#f5f5f5"/>
        <rect x="1020" y="56" width="200" height="64" rx="6" fill="#2d3142" fill-opacity="0.05" stroke="#4f5d75" stroke-width="1"/>
        <rect x="1028" y="64" width="40" height="12" rx="2" fill="none" stroke="#4f5d75" stroke-opacity="0.40" stroke-width="0.8"/>
        <text x="1048" y="73" fill="#4f5d75" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">STORE</text>
        <text x="1120" y="88" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">User Table</text>
        <text x="1120" y="105" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">primary key · Firebase uid</text>

        <line x1="40" y1="648" x2="1240" y2="648" stroke="#2d3142" stroke-opacity="0.10" stroke-width="0.8"/>
        <text x="40" y="664" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.18em">LEGEND</text>
        <line x1="160" y1="680" x2="196" y2="680" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#login-arrow-link)"/>
        <text x="208" y="684" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Authenticated request</text>
        <line x1="376" y1="680" x2="412" y2="680" stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#login-arrow)"/>
        <text x="424" y="684" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Return</text>
        <rect x="536" y="671" width="32" height="18" rx="2" fill="#2d3142" fill-opacity="0.02" stroke="#2d3142" stroke-opacity="0.22" stroke-width="1"/>
        <text x="552" y="683" fill="#4f5d75" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle">ALT</text>
        <text x="580" y="684" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">CurrentUser gate</text>
      </svg>
