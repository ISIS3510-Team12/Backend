<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 1280 720" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="current-user-title current-user-desc">
        <title id="current-user-title">Current application-user resolution</title>
        <desc id="current-user-desc">A protected endpoint resolves the CurrentUser dependency, which retrieves a User by the verified Firebase uid or returns HTTP 403 when no application profile exists.</desc>
        <defs>
          <style>@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;family=Noto+Serif:ital@0;1&amp;family=Noto+Sans+KR:wght@400;500;600&amp;family=Noto+Serif+KR:wght@400&amp;family=Noto+Sans+TC:wght@400;500;600&amp;family=Noto+Serif+TC:wght@400&amp;display=swap');</style>
          <marker id="login-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
            <polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/>
          </marker>
          <marker id="login-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
            <polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/>
          </marker>
          <marker id="login-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
            <polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/>
          </marker>
        </defs>

        <rect width="100%" height="100%" fill="#f5f5f5"/>

        <line x1="160" y1="120" x2="160" y2="624" stroke="#2d3142" stroke-opacity="0.20" stroke-width="1" stroke-dasharray="3,3"/>
        <line x1="480" y1="120" x2="480" y2="624" stroke="#2d3142" stroke-opacity="0.20" stroke-width="1" stroke-dasharray="3,3"/>
        <line x1="800" y1="120" x2="800" y2="624" stroke="#2d3142" stroke-opacity="0.20" stroke-width="1" stroke-dasharray="3,3"/>
        <line x1="1120" y1="120" x2="1120" y2="624" stroke="#2d3142" stroke-opacity="0.20" stroke-width="1" stroke-dasharray="3,3"/>

        <rect x="156" y="160" width="8" height="388" fill="#2d3142" fill-opacity="0.06" stroke="#4f5d75" stroke-width="0.8"/>
        <rect x="476" y="160" width="8" height="388" fill="#2d3142" fill-opacity="0.06" stroke="#4f5d75" stroke-width="0.8"/>
        <rect x="796" y="216" width="8" height="296" fill="#2d3142" fill-opacity="0.06" stroke="#4f5d75" stroke-width="0.8"/>
        <rect x="1116" y="272" width="8" height="56" fill="#2d3142" fill-opacity="0.06" stroke="#4f5d75" stroke-width="0.8"/>

        <line x1="164" y1="164" x2="476" y2="164" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#login-arrow-link)"/>
        <rect x="264" y="144" width="112" height="12" rx="2" fill="#f5f5f5"/>
        <text x="320" y="153" fill="#2e5aa8" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">C1 · PROTECTED API</text>

        <line x1="484" y1="220" x2="796" y2="220" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#login-arrow)"/>
        <rect x="584" y="200" width="112" height="12" rx="2" fill="#f5f5f5"/>
        <text x="640" y="209" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">C2 · CURRENT USER</text>

        <line x1="804" y1="276" x2="1116" y2="276" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#login-arrow)"/>
        <rect x="904" y="256" width="112" height="12" rx="2" fill="#f5f5f5"/>
        <text x="960" y="265" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">C3 · GET BY UID</text>

        <line x1="1116" y1="324" x2="804" y2="324" stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#login-arrow)"/>
        <rect x="904" y="304" width="112" height="12" rx="2" fill="#f5f5f5"/>
        <text x="960" y="313" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">C4 · USER/NONE</text>

        <rect x="104" y="352" width="752" height="216" rx="4" fill="#2d3142" fill-opacity="0.02" stroke="#2d3142" stroke-opacity="0.22" stroke-width="1"/>
