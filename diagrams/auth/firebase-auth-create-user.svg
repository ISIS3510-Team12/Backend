<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 1280 720" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="create-user-title create-user-desc">
        <title id="create-user-title">Create an application user</title>
        <desc id="create-user-desc">The create-user endpoint receives a validated profile and verified Firebase uid, rejects an existing application user with HTTP 409, or commits and returns a new User with HTTP 201.</desc>
        <defs>
          <style>@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;family=Noto+Serif:ital@0;1&amp;family=Noto+Sans+KR:wght@400;500;600&amp;family=Noto+Serif+KR:wght@400&amp;family=Noto+Sans+TC:wght@400;500;600&amp;family=Noto+Serif+TC:wght@400&amp;display=swap');</style>
          <marker id="provision-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
            <polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/>
          </marker>
          <marker id="provision-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
            <polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/>
          </marker>
          <marker id="provision-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
            <polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/>
          </marker>
        </defs>

        <rect width="100%" height="100%" fill="#f5f5f5"/>

        <!-- Lifelines -->
        <line x1="160" y1="120" x2="160" y2="624" stroke="#2d3142" stroke-opacity="0.20" stroke-width="1" stroke-dasharray="3,3"/>
        <line x1="480" y1="120" x2="480" y2="624" stroke="#2d3142" stroke-opacity="0.20" stroke-width="1" stroke-dasharray="3,3"/>
        <line x1="800" y1="120" x2="800" y2="624" stroke="#2d3142" stroke-opacity="0.20" stroke-width="1" stroke-dasharray="3,3"/>
        <line x1="1120" y1="120" x2="1120" y2="624" stroke="#2d3142" stroke-opacity="0.20" stroke-width="1" stroke-dasharray="3,3"/>

        <!-- Activation bars -->
        <rect x="156" y="156" width="8" height="440" fill="#2d3142" fill-opacity="0.06" stroke="#4f5d75" stroke-width="0.8"/>
        <rect x="476" y="156" width="8" height="440" fill="#2d3142" fill-opacity="0.06" stroke="#4f5d75" stroke-width="0.8"/>
        <rect x="796" y="208" width="8" height="376" fill="#2d3142" fill-opacity="0.06" stroke="#4f5d75" stroke-width="0.8"/>
        <rect x="1116" y="260" width="8" height="56" fill="#2d3142" fill-opacity="0.06" stroke="#4f5d75" stroke-width="0.8"/>
        <rect x="1116" y="488" width="8" height="56" fill="#2d3142" fill-opacity="0.06" stroke="#4f5d75" stroke-width="0.8"/>

        <!-- Create-user request -->
        <line x1="164" y1="160" x2="476" y2="160" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#provision-arrow-link)"/>
        <rect x="248" y="140" width="144" height="12" rx="2" fill="#f5f5f5"/>
        <text x="320" y="149" fill="#2e5aa8" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">S1 · POST /AUTH/CREATE_USER</text>

        <!-- FastAPI injects verified identity and validated profile -->
        <line x1="484" y1="212" x2="796" y2="212" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#provision-arrow)"/>
        <rect x="568" y="192" width="144" height="12" rx="2" fill="#f5f5f5"/>
        <text x="640" y="201" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">S2 · VERIFIED UID + PROFILE</text>

        <!-- Duplicate check -->
        <line x1="804" y1="264" x2="1116" y2="264" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#provision-arrow)"/>
        <rect x="904" y="244" width="112" height="12" rx="2" fill="#f5f5f5"/>
        <text x="960" y="253" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">S3 · GET BY UID</text>

        <line x1="1116" y1="312" x2="804" y2="312" stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#provision-arrow)"/>
        <rect x="904" y="292" width="112" height="12" rx="2" fill="#f5f5f5"/>
        <text x="960" y="301" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">S4 · USER / NONE</text>

        <!-- Existing-user / creation branch -->
        <rect x="104" y="332" width="1072" height="268" rx="4" fill="#2d3142" fill-opacity="0.02" stroke="#2d3142" stroke-opacity="0.22" stroke-width="1"/>
        <rect x="104" y="332" width="40" height="16" rx="2" fill="#f5f5f5" stroke="#2d3142" stroke-opacity="0.22" stroke-width="1"/>
        <text x="124" y="344" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.12em">ALT</text>

        <text x="116" y="368" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.04em">[uid already exists]</text>
        <line x1="796" y1="392" x2="484" y2="392" stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#provision-arrow)"/>
        <rect x="588" y="372" width="104" height="12" rx="2" fill="#f5f5f5"/>
        <text x="640" y="381" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">S5 · RAISE 409</text>
        <line x1="476" y1="424" x2="164" y2="424" stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#provision-arrow)"/>
        <rect x="272" y="404" width="96" height="12" rx="2" fill="#f5f5f5"/>
        <text x="320" y="413" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">S6 · HTTP 409</text>

        <line x1="112" y1="448" x2="1168" y2="448" stroke="#2d3142" stroke-opacity="0.20" stroke-width="1" stroke-dasharray="4,3"/>
        <text x="116" y="472" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.04em">[else · new uid]</text>
        <line x1="804" y1="492" x2="1116" y2="492" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#provision-arrow)"/>
        <rect x="880" y="472" width="160" height="12" rx="2" fill="#f5f5f5"/>
        <text x="960" y="481" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">S7 · ADD + COMMIT + REFRESH</text>
        <line x1="1116" y1="536" x2="804" y2="536" stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#provision-arrow)"/>
        <rect x="900" y="516" width="120" height="12" rx="2" fill="#f5f5f5"/>
        <text x="960" y="525" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">S8 · CREATED USER</text>
        <line x1="796" y1="560" x2="484" y2="560" stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#provision-arrow)"/>
        <rect x="588" y="540" width="104" height="12" rx="2" fill="#f5f5f5"/>
        <text x="640" y="549" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">S9 · RETURN USER</text>
        <line x1="476" y1="584" x2="164" y2="584" stroke="#eb6c36" stroke-width="1.4" marker-end="url(#provision-arrow-accent)"/>
        <rect x="268" y="564" width="104" height="12" rx="2" fill="#f5f5f5"/>
        <text x="320" y="573" fill="#eb6c36" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">S10 · HTTP 201</text>

        <!-- Actors -->
        <rect x="60" y="56" width="200" height="64" rx="6" fill="#f5f5f5"/>
        <rect x="60" y="56" width="200" height="64" rx="6" fill="#4f5d75" fill-opacity="0.10" stroke="#7a8399" stroke-width="1"/>
        <rect x="68" y="64" width="32" height="12" rx="2" fill="none" stroke="#7a8399" stroke-opacity="0.40" stroke-width="0.8"/>
        <text x="84" y="73" fill="#7a8399" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">APP</text>
        <text x="160" y="88" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Mobile App</text>
        <text x="160" y="105" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">profile fields + ID token</text>

        <rect x="380" y="56" width="200" height="64" rx="6" fill="#f5f5f5"/>
        <rect x="380" y="56" width="200" height="64" rx="6" fill="#eb6c36" fill-opacity="0.08" stroke="#eb6c36" stroke-width="1"/>
        <rect x="388" y="64" width="32" height="12" rx="2" fill="none" stroke="#eb6c36" stroke-opacity="0.50" stroke-width="0.8"/>
        <text x="404" y="73" fill="#eb6c36" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">API</text>
        <text x="480" y="88" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Backend API</text>
        <text x="480" y="105" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">FastAPI route + dependencies</text>

        <rect x="700" y="56" width="200" height="64" rx="6" fill="#f5f5f5"/>
        <rect x="700" y="56" width="200" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <rect x="708" y="64" width="56" height="12" rx="2" fill="none" stroke="#2d3142" stroke-opacity="0.30" stroke-width="0.8"/>
        <text x="736" y="73" fill="#4f5d75" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">ENDPOINT</text>
        <text x="800" y="88" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Create User Endpoint</text>
        <text x="800" y="105" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">create_user(...) -&gt; User</text>

        <rect x="1020" y="56" width="200" height="64" rx="6" fill="#f5f5f5"/>
        <rect x="1020" y="56" width="200" height="64" rx="6" fill="#2d3142" fill-opacity="0.05" stroke="#4f5d75" stroke-width="1"/>
        <rect x="1028" y="64" width="40" height="12" rx="2" fill="none" stroke="#4f5d75" stroke-opacity="0.40" stroke-width="0.8"/>
        <text x="1048" y="73" fill="#4f5d75" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">STORE</text>
        <text x="1120" y="88" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">User Table</text>
        <text x="1120" y="105" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">user_id = Firebase uid</text>

        <!-- Legend -->
        <line x1="40" y1="648" x2="1240" y2="648" stroke="#2d3142" stroke-opacity="0.10" stroke-width="0.8"/>
        <text x="40" y="664" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.18em">LEGEND</text>

        <line x1="160" y1="680" x2="196" y2="680" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#provision-arrow)"/>
        <text x="208" y="684" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Call</text>

        <line x1="304" y1="680" x2="340" y2="680" stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#provision-arrow)"/>
        <text x="352" y="684" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Return / error</text>

        <line x1="504" y1="680" x2="540" y2="680" stroke="#eb6c36" stroke-width="1.4" marker-end="url(#provision-arrow-accent)"/>
        <text x="552" y="684" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">HTTP 201 response</text>

        <rect x="744" y="675" width="20" height="12" rx="2" fill="#2d3142" fill-opacity="0.05" stroke="#4f5d75" stroke-width="1"/>
        <text x="776" y="684" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">User table</text>
      </svg>
